# Render Blueprint for the PactPay Arena PUBLIC DEMO (docs/DEPLOYMENT.md).
#
# This file holds NO secret values. The operator passcode is generated by Render and shown only in the dashboard;
# the PayPal sandbox values are prompted for in the dashboard (sync: false) and are optional.
#
# One instance only: the database is a SQLite file owned by one process, and the rate limits are in-process.
# Do not set numInstances above 1 or enable autoscaling.
services:
  - type: web
    name: pactpay-arena
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    # --include=dev: the build needs TypeScript and the type packages, which are devDependencies.
    # The seeded benchmark results are generated at build time (5 seconds) because that file is git-ignored and the Cockpit needs it.
    buildCommand: npm ci --include=dev && npm run build && npm run benchmark
    # Validates the environment, creates/migrates the database, adds the synthetic demo data, then runs `next start`.
    startCommand: npm run start:demo
    # 200 only when the service can serve (database migrated, configuration valid); otherwise 503.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      # Demo mode: https + operator passcode are required at startup; HSTS and noindex headers are added. Needed at BUILD
      # time too (response headers are fixed when the app is built), which is why it is set here and not at runtime only.
      - key: DEPLOY_MODE
        value: demo
      # APP_BASE_URL is not set on purpose: in demo mode it falls back to RENDER_EXTERNAL_URL (set by Render). Set it
      # yourself only for a custom domain.
      - key: DATABASE_PATH
        # FREE PLAN: this file lives on an ephemeral disk and is recreated (migrated and re-seeded) after every deploy,
        # restart and idle spin-down. See docs/DEPLOYMENT.md to keep data: a paid plan with a persistent disk.
        value: ./data/pactpay.db
      # Generated once by Render; read it in the dashboard (Environment). Never put a passcode in this file.
      - key: OPERATOR_PASSCODE
        generateValue: true
      - key: AGENT_MODE
        value: scripted
      # PayPal is SANDBOX ONLY in every mode (the app refuses anything else). All four are optional: without them the
      # payment step says it cannot start and the rest of the demo works. If the dashboard insists on a value, enter
      # `replace-with-later`: placeholders with that prefix count as unset.
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
    # To KEEP data across deploys (paid plan only), uncomment this and set DATABASE_PATH to /var/data/pactpay.db:
    # plan: starter
    # disk:
    #   name: pactpay-data
    #   mountPath: /var/data
    #   sizeGB: 1
